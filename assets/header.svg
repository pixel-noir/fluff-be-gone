<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="fluff-be-gone: a reply with its filler sentences struck out in red pen">
  <rect width="1200" height="400" fill="#f4efe4"/>
  <!-- ruled paper -->
  <g stroke="#d9d1bf" stroke-width="1">
    <line x1="0" y1="232" x2="1200" y2="232"/>
    <line x1="0" y1="282" x2="1200" y2="282"/>
    <line x1="0" y1="332" x2="1200" y2="332"/>
    <line x1="0" y1="382" x2="1200" y2="382"/>
  </g>
  <line x1="96" y1="0" x2="96" y2="400" stroke="#e3a59a" stroke-width="1.5"/>

  <text x="130" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#1a1a1a" letter-spacing="-1">fluff-be-gone</text>
  <text x="132" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#5b554b">Cuts the filler, not the grammar.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    <text x="130" y="224" fill="#8c8576" textLength="520" lengthAdjust="spacingAndGlyphs">Great question! I'd be happy to help.</text>
    <text x="130" y="274" fill="#1a1a1a" textLength="560" lengthAdjust="spacingAndGlyphs">Node doesn't read .env automatically.</text>
    <text x="130" y="324" fill="#8c8576" textLength="660" lengthAdjust="spacingAndGlyphs">Let me know if you have other questions!</text>
    <text x="130" y="374" fill="#8c8576" textLength="230" lengthAdjust="spacingAndGlyphs">Hope this helps!</text>
  </g>

  <!-- red pen strikes, slightly uneven like a real hand -->
  <g fill="none" stroke="#c8321e" stroke-width="3.2" stroke-linecap="round">
    <path d="M124 217 C 260 213, 420 219, 658 214"/>
    <path d="M124 317 C 340 320, 560 312, 796 316"/>
    <path d="M124 367 C 200 364, 290 370, 362 365"/>
  </g>
  <!-- tick next to the kept line -->
  <path d="M700 264 l 9 10 l 20 -24" fill="none" stroke="#2f6b3a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
